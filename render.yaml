  }
  function send(type, data = {}) { if (state.ws?.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify({ type, ...data })); }
  setInterval(() => { if (state.connected) send('heartbeat'); }, 25000);
  function askName() {
